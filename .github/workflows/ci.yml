name: DDD CQRS RabbitMQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on main re-runs the pipeline and deploys, e.g. to recreate the stack after
  # the Destroy workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy (it could leave a Terraform state lock behind).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ddd_project
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push'
        with:
          file: ./coverage/lcov.info

      - name: Run E2E tests (real PostgreSQL)
        run: npm run test:e2e:run
        env:
          NODE_ENV: e2e
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ddd_project
          DB_USER: postgres
          DB_PASSWORD: postgres
          API_KEY: local-dev-key

      - name: Run Postman collection (real PostgreSQL, live server)
        run: npm run test:collection:run
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ddd_project
          DB_USER: postgres
          DB_PASSWORD: postgres
          API_KEY: local-dev-key

      - name: Build
        run: npm run build

  docker:
    name: Docker build & validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ddd-cqrs-rabbitmq:ci .

      - name: Start the application stack via Docker Compose
        # Excludes jaeger/prometheus/grafana — they add ~800MB of image pulls
        # and nothing this job checks (health + Postman) exercises them.
        # app is unscaled (1 replica) here — nginx fronts it either way, so
        # this also validates the load-balanced path with a trivial case.
        run: docker compose up -d --build postgres rabbitmq app nginx consumer outbox-relay pgadmin

      - name: Wait for app health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "App is healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time." >&2
          docker compose logs
          exit 1

      - name: Run Postman collection against the containerized app
        run: npx --yes newman@6.2.2 run ddd-cqrs-rabbitmq.postman_collection.json --env-var "baseUrl=http://localhost:3000" --env-var "apiKey=local-dev-key"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down -v

  infra:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: infra/
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: bootstrap/
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploys to real AWS on every push to main (or a manual run on main), once the checks pass.
  # Auth is GitHub OIDC -> IAM role (bootstrap/), so no AWS keys are stored in GitHub.
  # Configuration lives in the `production` GitHub environment (docs/deployment.md); until
  # AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and stays green.
  deploy:
    name: Deploy to AWS
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test, docker, infra]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. Run scripts/bootstrap.sh (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time, so local runs keep local state.
      - name: Terraform init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=ddd-cqrs-rabbitmq/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The ECS service needs the image to exist, so the registry comes first (a no-op after the
      # first deploy), then the image is pushed, then the rest of the stack is applied.
      - name: Terraform apply (ECR repository)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color -auto-approve -target=aws_ecr_repository.app 2>&1 | tee ecr.log

      - name: Build and push the image
        if: steps.config.outputs.enabled == 'true'
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"

      - name: Terraform plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary without downloading the raw log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: infra
        run: |
          for f in ecr.log plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: Wait for the ECS services
        if: steps.config.outputs.enabled == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services $(terraform -chdir=infra output -json ecs_services | jq -r '.[]')

      - name: Smoke tests (real AWS)
        if: steps.config.outputs.enabled == 'true'
        run: |
          API=$(terraform -chdir=infra output -raw api_url)
          KEY=$(aws ssm get-parameter --with-decryption \
            --name "$(terraform -chdir=infra output -raw api_key_parameter)" \
            --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          API_URL="$API" API_KEY="$KEY" scripts/smoke-test.sh
          {
            echo "### Deployed :rocket:"
            echo "API: ${API} (header X-API-Key, stored in SSM: $(terraform -chdir=infra output -raw api_key_parameter))"
            echo
            echo "CQRS read model: ${API}/read-models/orders"
          } >> "$GITHUB_STEP_SUMMARY"
