events {
  worker_connections 4096;
}

http {
  # Docker's embedded DNS. A short TTL plus the $upstream-variable trick
  # below forces nginx to re-resolve "app" on every request instead of
  # caching it once at startup — required for it to see replicas added or
  # removed by `docker compose up --scale app=N` without a config reload.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /health {
      access_log off;
      set $upstream app:3000;
      proxy_pass http://$upstream;
    }

    location / {
      set $upstream app:3000;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
