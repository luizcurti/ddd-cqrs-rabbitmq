global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: "consumer"
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer:9091"]

  - job_name: "outbox-relay"
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-relay:9092"]
